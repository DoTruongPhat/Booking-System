# APPLICATION
spring.application.name=camunda-service
server.port=${SERVER_PORT:8084}

# DATASOURCE — Camunda ACT_* tables dùng public schema trong booking_db
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}?currentSchema=${DB_SCHEMA:public}
spring.datasource.username=${DB_USERNAME:booking_user}
spring.datasource.password=${DB_PASSWORD:BookingPass@2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI
spring.datasource.hikari.pool-name=CamundaHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# JPA — Camunda tự quản lý schema, không dùng Hibernate DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CAMUNDA
camunda.bpm.database.schema-update=true
camunda.bpm.database.type=postgres
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.first-name=Admin
camunda.bpm.filter.create=All Tasks
camunda.bpm.authorization.enabled=false
camunda.bpm.history-level=full
camunda.bpm.default-serialization-format=application/json
camunda.bpm.generic-properties.properties.enforceHistoryTimeToLive=false

# SECURITY
app.jwt.secret-key=${JWT_SECRET_KEY:booking-system-jwt-secret-key-very-long-at-least-32-chars-2024}
app.internal.api-key=${INTERNAL_API_KEY:internal-workflow-key-2024}

# EXTERNAL SERVICES
app.service.booking-url=${BOOKING_SERVICE_URL:http://localhost:8082}
app.service.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${WORKFLOW_CONSUMER_GROUP:camunda-workflow-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.topic.core-events=${CORE_EVENTS_TOPIC:core-events}

# JACKSON
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized

# LOGGING
logging.level.com.booking.camunda=INFO
logging.level.org.camunda=INFO

management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=camunda-service

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://${TEMPO_HOST:localhost}:4318/v1/traces
