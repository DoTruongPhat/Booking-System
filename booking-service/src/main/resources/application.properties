# =====================================================
# APPLICATION
# =====================================================
spring.application.name=booking-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =====================================================
# SERVER
# =====================================================
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:10}
server.tomcat.connection-timeout=${TOMCAT_CONN_TIMEOUT:20000}

# =====================================================
# DATASOURCE
# =====================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:booking_db}?currentSchema=booking
spring.datasource.username=${DB_USERNAME:booking_user}
spring.datasource.password=${DB_PASSWORD:BookingPass@2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# HIKARI POOL
# =====================================================
spring.datasource.hikari.pool-name=BookingHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# =====================================================
# JPA
# =====================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=booking
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# FLYWAY
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=booking
spring.flyway.default-schema=booking
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =====================================================
# REDIS
# =====================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:RedisPass@2024}
spring.data.redis.timeout=3000ms

# =====================================================
# KAFKA
# =====================================================
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}

# Producer: StringSerializer vì code g?i objectMapper.writeValueAsString() tr??c khi send
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all  
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer: StringDeserializer vì consumer t? deserialize qua objectMapper.readValue()
spring.kafka.consumer.group-id=booking-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =====================================================
# SECURITY (JWT VERIFY ONLY)
# =====================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.jwt.secret-key=${JWT_SECRET_KEY:ThisIsAVeryLongSecretKeyForJWTSigning2024BookingSystem!}
jwt.public-key-url=${JWT_PUBLIC_KEY_URL:http://localhost:8081/api/auth/public-key}

# =====================================================
# JACKSON
# =====================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# =====================================================
# FILE UPLOAD (Room Images)
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2MB

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when_authorized

# =====================================================
# LOGGING
# =====================================================
logging.level.com.booking=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN

# =====================================================
# APP
# =====================================================
app.timezone=Asia/Ho_Chi_Minh

# =====================================================
# BOOKING CONFIG
# =====================================================
app.booking.pending-timeout-minutes=15
app.booking.no-show-hours=24
app.booking.max-advance-booking-days=365

# =====================================================
# CANCELLATION
# =====================================================
app.cancellation.free-cancel-hours=48
app.cancellation.partial-refund-hours=24
app.cancellation.partial-refund-percent=50

# =====================================================
# AVAILABILITY
# =====================================================
app.availability.generate-days-ahead=365
app.availability.calendar-days=90

# =====================================================
# CACHE
# =====================================================
app.cache.room-availability-ttl-minutes=5
app.cache.search-result-ttl-minutes=1