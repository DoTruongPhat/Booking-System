# APPLICATION
spring.application.name=payment-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SERVER — port 8083 (khop gateway route)
server.port=${SERVER_PORT:8083}
server.servlet.context-path=/

# DATASOURCE
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}?currentSchema=payment
spring.datasource.username=${DB_USERNAME:booking_user}
spring.datasource.password=${DB_PASSWORD:BookingPass@2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI
spring.datasource.hikari.pool-name=PaymentHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:3}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=payment
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=payment
spring.flyway.default-schema=payment
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:RedisPass@2024}
spring.data.redis.timeout=3000ms

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# SECURITY
app.jwt.secret-key=${JWT_SECRET_KEY:ThisIsAVeryLongSecretKeyForJWTSigning2024BookingSystem!}
app.security.api-key=${API_KEY:booking-api-key-2024}
app.internal.api-key=${INTERNAL_API_KEY:internal-payment-key-2024}
app.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8082}

# JACKSON
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized

# LOGGING
logging.level.com.booking.payment=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN

# PAYMENT CONFIG
app.payment.expiration-minutes=${PAYMENT_EXPIRATION_MINUTES:30}
app.payment.mock-callback-delay-seconds=5
app.payment.expire-check-interval=60000

# GATEWAY CONFIG
app.gateway.vnpay.enabled=false
app.gateway.vnpay.callback-url=http://localhost:8080/api/payments/callback/vnpay
app.gateway.vnpay.return-url=http://localhost:4200/payment/callback

app.gateway.vietqr.enabled=false

# KAFKA TOPICS
app.kafka.topic.payment-events=payment-events
app.kafka.topic.core-events=core-events

management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=payment-service

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://${TEMPO_HOST:localhost}:4318/v1/traces


