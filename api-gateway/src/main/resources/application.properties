# API GATEWAY
spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}

# CORS ? Angular dev server (localhost:4200)
# allow-credentials=true BAT BUOC vi frontend dung withCredentials
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# IDEMPOTENCY CONFIG
idempotency.lock-ttl=30s
idempotency.cache-ttl=24h
idempotency.header-name=Idempotency-Key
idempotency.lock-prefix=idempotency:lock:
idempotency.cache-prefix=idempotency:

idempotency.methods[0]=POST
idempotency.methods[1]=PUT
idempotency.methods[2]=PATCH
idempotency.methods[3]=DELETE

idempotency.included-paths[0]=/api/bookings
idempotency.included-paths[1]=/api/payments
idempotency.included-paths[2]=/api/user/bookings

# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# GATEWAY ROUTES
