apiVersion: 1
groups:
  - orgId: 1
    name: booking-system-alerts
    folder: Booking System
    interval: 1m
    rules:
      - uid: service-down
        title: Service Down
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up == 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: "-100"
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Service is DOWN
      - uid: high-error-rate
        title: High Error Rate
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job) / sum(rate(http_server_requests_seconds_count[5m])) by (job)
              instant: true
              refId: A
          - refId: B
            datasourceUid: "-100"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Error rate exceeds 5%
      - uid: high-response-time
        title: High Response Time P95
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (job, le))
              instant: true
              refId: A
          - refId: B
            datasourceUid: "-100"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: P95 response time exceeds 2 seconds
      - uid: high-heap-memory
        title: JVM Heap Memory High
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: "-100"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: JVM heap memory exceeds 80%
      - uid: db-pool-exhausted
        title: DB Connection Pool Near Exhaustion
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: hikaricp_connections_active / hikaricp_connections_max
              instant: true
              refId: A
          - refId: B
            datasourceUid: "-100"
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: DB connection pool exceeds 80%