global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081']
        labels:
          service: auth-service

  - job_name: 'booking-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['booking-service:8082']
        labels:
          service: booking-service

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8083']
        labels:
          service: payment-service

  - job_name: 'camunda-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['camunda-service:8084']
        labels:
          service: camunda-service

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: api-gateway

  - job_name: 'keycloak'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'keycloak:8180' ]
        labels:
          service: keycloak-provider
