# ============================================ #
# Booking System — Local dev stack             #
# ============================================ #
# Chạy: docker compose up -d
# Tắt: docker compose down
# Reset: docker compose down -v
# Rebuild: docker compose build tên-service
#
# Bao gồm:
# - postgres (5432)
# - redis (6379)
# - kafka (29092 external, 9092 internal)
# - keycloak (8180) với provider tùy chỉnh + realm preloaded
# ============================================

services:
  # ─── Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    environment:
      POSTGRES_DB: ${DB_NAME:-booking_db}
      POSTGRES_USER: ${DB_USER:-booking_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BookingPass@2024}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booking_user} -d ${DB_NAME:-booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Cache ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: booking-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-RedisPass@2024}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisPass@2024}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-ui:
    image: redis/redisinsight:latest
    container_name: redis-ui
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  # ─── Message Queue ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: booking-zookeeper
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: booking-kafka
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    depends_on:
      - zookeeper

  # ─── Auth & Identity ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: booking-keycloak
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    command: [ "start-dev", "--http-port=8180", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-Admin@2024}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_URL: http://keycloak:8180
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_ADMIN_URL: http://localhost:8180
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-booking_db}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${DB_USER:-booking_user}
      KC_DB_PASSWORD: ${DB_PASSWORD:-BookingPass@2024}
      KC_IMPORT_STRATEGY: IGNORE_EXISTING
    ports:
      - "${KC_PORT:-8180}:8180"
    volumes:
      - ./docker/keycloak/providers:/opt/keycloak/providers:ro
      - ./docker/keycloak/realms:/opt/keycloak/data/import:ro
      - ./docker/keycloak/themes/booking:/opt/keycloak/themes/booking:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy


  auth-service:
    build: ./auth-service
    container_name: booking-auth
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_USER: ${DB_USER:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-BookingPass@2024}
      DB_NAME: ${DB_NAME:-booking_db}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass@2024}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-booking-system-jwt-secret-key-very-long-at-least-32-chars-2024}
      KC_URL: http://keycloak:8180
      KC_ISSUER_URL: http://localhost:8180
      KC_ADMIN: ${KC_ADMIN:-admin}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-Admin@2024}
      INTERNAL_API_KEY: internal-workflow-key-2024
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TEMPO_HOST: tempo
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/api/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  # ─── Booking Service ────────────────────────────────────────
#  booking-service:
#    build: ./booking-service
#    container_name: booking-service
#    restart: unless-stopped
#    mem_limit: 1g
#    cpus: 1.5
#    environment:
#      SPRING_PROFILES_ACTIVE: docker
#      DB_HOST: postgres
#      DB_USERNAME: ${DB_USERNAME:-booking_user}
#      DB_PASSWORD: ${DB_PASSWORD:-BookingPass@2024}
#      DB_NAME: ${DB_NAME:-booking_db}
#      REDIS_HOST: redis
#      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass@2024}
#      KAFKA_SERVERS: kafka:9092
#      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-booking-system-jwt-secret-key-very-long-at-least-32-chars-2024}
#      JWT_PUBLIC_KEY_URL: http://localhost:8081/api/auth/public-key
#      JWT_ISSUER_URI: http://auth-service:8081
#      JWT_JWK_SET_URI: http://auth-service:8081/api/auth/public-key
#      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-payment-key-2024}
#      INTERNAL_API_KEY: internal-workflow-key-2024
  booking-service:
    build: ./booking-service
    container_name: booking-service
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-BookingPass@2024}
      DB_NAME: ${DB_NAME:-booking_db}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass@2024}
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-booking-system-jwt-secret-key-very-long-at-least-32-chars-2024}
      JWT_PUBLIC_KEY_URL: http://localhost:8081/api/auth/public-key
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/api/auth/public-key
      INTERNAL_API_KEY: internal-workflow-key-2024
      BOOKING_PENDING_TIMEOUT_MINUTES: 30
      BOOKING_PAYMENT_DEADLINE_DAYS_BEFORE_CHECKIN: 1
      TEMPO_HOST: tempo
      MAIL_ENABLED: "true"
      MAIL_USERNAME: "dotruongphat9@gmail.com"
      MAIL_PASSWORD: "jfpx qbld lajn kdbn"
      MAIL_FROM: "dotruongphat9@gmail.com"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: booking-payment
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-BookingPass@2024}
      DB_NAME: ${DB_NAME:-booking_db}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass@2024}
      KAFKA_SERVERS: kafka:9092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-booking-system-jwt-secret-key-very-long-at-least-32-chars-2024}
      BOOKING_SERVICE_URL: http://booking-service:8082
      INTERNAL_API_KEY: internal-workflow-key-2024
      PAYMENT_EXPIRATION_MINUTES: 30
      TEMPO_HOST: tempo
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    build: ./api-gateway
    container_name: booking-gateway
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass@2024}
      BOOKING_SERVICE_URL: http://booking-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8083
      WORKFLOW_SERVICE_URL: http://camunda-service:8084
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - booking-service
      - payment-service
      - camunda-service

  # ─── Mail (Dev) ─────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog
    container_name: booking-mailhog
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI


  # ─── Camunda Workflow Service ────────────────────────────────
  camunda-service:
    build: ./camunda-service
    container_name: booking-camunda
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-BookingPass@2024}
      DB_NAME: ${DB_NAME:-booking_db}
      DB_SCHEMA: public
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-booking-system-jwt-secret-key-very-long-at-least-32-chars-2024}
      BOOKING_SERVICE_URL: http://booking-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      KAFKA_SERVERS: kafka:9092
      INTERNAL_API_KEY: internal-workflow-key-2024
      TEMPO_HOST: tempo
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      booking-service:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
  # ─── Observability Stack ─────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: booking-loki
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    container_name: booking-promtail
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.3.0
    container_name: booking-tempo
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: booking-prometheus
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'

  grafana:
    image: grafana/grafana:10.2.0
    container_name: booking-grafana
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./observability/grafana-dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
      - ./observability/grafana-alerts.yaml:/etc/grafana/provisioning/alerting/alerts.yaml:ro
    depends_on:
      - loki
      - tempo
      - prometheus
  # ─── Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
  redisinsight_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
