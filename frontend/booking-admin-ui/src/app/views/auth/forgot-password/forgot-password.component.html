<div class="forgot-page">
  <div class="forgot-card">
    <div class="forgot-header">
      <h1 class="brand">SmartBooking</h1>
      <p class="subtitle">Quên mật khẩu?</p>
    </div>

    <ng-container *ngIf="!isSent(); else sentTemplate">
      <p class="description">Nhập email của bạn và chúng tôi sẽ gửi link đặt lại mật khẩu.</p>

      <nz-alert
        *ngIf="errorMessage()"
        nzType="error"
        [nzMessage]="errorMessage()"
        nzShowIcon
        class="forgot-alert"
      ></nz-alert>

      <form nz-form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" nzLayout="vertical">
        <nz-form-item>
          <nz-form-label nzRequired>Email</nz-form-label>
          <nz-form-control nzErrorTip="Email không hợp lệ!">
            <input
              nz-input
              formControlName="email"
              placeholder="Nhập email của bạn"
              size="large"
              autocomplete="email"
            />
          </nz-form-control>
        </nz-form-item>

        <button
          nz-button
          nzType="primary"
          nzSize="large"
          nzBlock
          [nzLoading]="isSubmitting()"
          type="submit"
          [disabled]="forgotForm.invalid"
        >
          {{ isSubmitting() ? 'Đang gửi...' : 'Gửi link đặt lại' }}
        </button>
      </form>
    </ng-container>

    <ng-template #sentTemplate>
      <div class="success-state">
        <div class="success-icon">
          <span nz-icon nzType="check-circle" nzTheme="fill"></span>
        </div>
        <h3 class="success-title">Đã gửi OTP!</h3>
        <p class="success-desc">
          Vui lòng kiểm tra hộp thư đến của bạn.<br />
          Mã OTP có hiệu lực trong <strong>10 phút</strong>.
        </p>

        <!-- NÚT MỚI: navigate tới form nhập OTP -->
        <button
          nz-button
          nzType="primary"
          nzSize="large"
          nzBlock
          (click)="goToResetPassword()"
          class="back-btn"
        >
          <span nz-icon nzType="key"></span>
          Nhập mã OTP
        </button>

        <button
          nz-button
          nzSize="large"
          nzBlock
          (click)="backToLogin()"
          class="back-btn"
          style="margin-top: 8px"
        >
          Quay lại trang đăng nhập
        </button>

        <!-- Resend -->
        <div class="resend-wrap">
          <span class="resend-label">Không nhận được email?</span>
          <button
            type="button"
            class="resend-btn"
            [disabled]="resendCountdown() > 0"
            (click)="resendEmail()"
          >
            <span *ngIf="resendCountdown() > 0"> Gửi lại sau {{ resendCountdown() }}s </span>
            <span *ngIf="resendCountdown() <= 0">
              <span nz-icon nzType="reload"></span> Gửi lại email
            </span>
          </button>
        </div>
      </div>
    </ng-template>

    <div class="forgot-footer" *ngIf="!isSent()">
      <a routerLink="/auth/login">
        <span nz-icon nzType="left"></span>
        Quay lại đăng nhập
      </a>
    </div>
  </div>
</div>
