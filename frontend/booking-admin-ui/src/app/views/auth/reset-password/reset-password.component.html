<div class="reset-page">
  <div class="reset-card">
    <div class="reset-header">
      <div class="reset-icon-wrap">
        <span class="reset-icon" nz-icon nzType="lock" nzTheme="fill"></span>
      </div>
      <h1 class="reset-title">Đặt lại mật khẩu</h1>
      <p class="reset-subtitle">
        Nhập mã OTP đã gửi tới <strong>{{ email }}</strong>
      </p>
    </div>

    <!-- Error alert -->
    <nz-alert
      *ngIf="errorMessage() && !successMessage()"
      nzType="error"
      [nzMessage]="errorMessage()"
      nzShowIcon
      class="reset-alert"
    ></nz-alert>

    <!-- Form -->
    <form
      *ngIf="!successMessage()"
      nz-form
      [formGroup]="resetForm"
      (ngSubmit)="onSubmit()"
      nzLayout="vertical"
    >
      <!-- OTP -->
      <nz-form-item>
        <nz-form-label nzRequired>Mã OTP</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập mã OTP 6 số">
          <input
            nz-input
            formControlName="otp"
            placeholder="Nhập mã 6 số từ email"
            size="large"
            maxlength="6"
            style="text-align: center; letter-spacing: 8px; font-size: 24px; font-weight: bold"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- New password -->
      <nz-form-item>
        <nz-form-label nzRequired>Mật khẩu mới</nz-form-label>
        <nz-form-control nzErrorTip="Mật khẩu phải có ít nhất 8 ký tự">
          <input
            nz-input
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="Tối thiểu 8 ký tự"
            size="large"
            autocomplete="new-password"
            (input)="onPasswordChange()"
          />
        </nz-form-control>
        <div class="password-strength" *ngIf="resetForm.get('newPassword')?.value">
          <nz-progress
            [nzPercent]="passwordStrength()"
            [nzShowInfo]="false"
            [nzStrokeColor]="passwordStrengthColor"
          ></nz-progress>
          <span class="strength-label" [style.color]="passwordStrengthColor">
            {{ passwordStrengthLabel }}
          </span>
        </div>
      </nz-form-item>

      <!-- Confirm password -->
      <nz-form-item>
        <nz-form-label nzRequired>Xác nhận mật khẩu mới</nz-form-label>
        <nz-form-control
          [nzErrorTip]="
            resetForm.errors?.['passwordMismatch']
              ? 'Mật khẩu xác nhận không khớp!'
              : 'Vui lòng xác nhận mật khẩu!'
          "
        >
          <input
            nz-input
            [type]="confirmPasswordVisible() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Nhập lại mật khẩu mới"
            size="large"
            autocomplete="new-password"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- Submit -->
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        nzBlock
        [nzLoading]="isSubmitting()"
        type="submit"
        [disabled]="resetForm.invalid"
        class="submit-btn"
      >
        <span *ngIf="!isSubmitting()" nz-icon nzType="check-circle"></span>
        {{ isSubmitting() ? 'Đang xử lý...' : 'Đặt lại mật khẩu' }}
      </button>
    </form>

    <!-- Success state -->
    <div *ngIf="successMessage()" class="success-state">
      <div class="success-icon-wrap">
        <span class="success-icon" nz-icon nzType="check-circle" nzTheme="fill"></span>
      </div>
      <h3 class="success-title">Đặt lại mật khẩu thành công!</h3>
      <p class="success-desc">
        Tự động chuyển đến trang đăng nhập sau
        <strong>{{ redirectCountdown() }}</strong> giây...
      </p>
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        nzBlock
        (click)="redirectNow()"
        class="submit-btn"
      >
        <span nz-icon nzType="login"></span>
        Đăng nhập ngay
      </button>
    </div>

    <!-- Footer -->
    <div class="reset-footer" *ngIf="!successMessage()">
      <a routerLink="/auth/forgot-password">
        <span nz-icon nzType="left"></span>
        Gửi lại mã OTP
      </a>
      <span style="margin: 0 8px; color: #d9d9d9">|</span>
      <a routerLink="/auth/login"> Quay lại đăng nhập </a>
    </div>
  </div>
</div>
