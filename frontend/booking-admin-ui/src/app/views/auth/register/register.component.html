<div class="register-page">
  <div class="register-card">
    <div class="register-header">
      <h1 class="brand">SmartBooking</h1>
      <p class="subtitle">Tạo tài khoản mới để bắt đầu</p>
    </div>

    <!-- Success alert -->
    <nz-alert
      *ngIf="successMessage()"
      nzType="success"
      [nzMessage]="successMessage()"
      nzShowIcon
      class="register-alert"
    ></nz-alert>

    <!-- Error alert -->
    <nz-alert
      *ngIf="errorMessage()"
      nzType="error"
      [nzMessage]="errorMessage()"
      nzShowIcon
      class="register-alert"
    ></nz-alert>

    <form nz-form [formGroup]="registerForm" (ngSubmit)="onSubmit()" nzLayout="vertical">
      <!-- Họ và tên -->
      <nz-form-item>
        <nz-form-label nzRequired>Họ và tên</nz-form-label>
        <nz-form-control nzErrorTip="Vui lòng nhập họ và tên (tối thiểu 2 ký tự)!">
          <input
            nz-input
            formControlName="fullName"
            placeholder="Nguyễn Văn A"
            size="large"
            autocomplete="name"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- Tên đăng nhập -->
      <nz-form-item>
        <nz-form-label nzRequired>Tên đăng nhập</nz-form-label>
        <nz-form-control nzErrorTip="Tên đăng nhập phải có ít nhất 3 ký tự, chỉ gồm chữ, số và _">
          <input
            nz-input
            formControlName="username"
            placeholder="nguyenvana"
            size="large"
            autocomplete="username"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- Email -->
      <nz-form-item>
        <nz-form-label nzRequired>Email</nz-form-label>
        <nz-form-control nzErrorTip="Email không hợp lệ!">
          <input
            nz-input
            formControlName="email"
            placeholder="example@email.com"
            size="large"
            type="email"
            autocomplete="email"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- Số điện thoại -->
      <nz-form-item>
        <nz-form-label nzRequired>Số điện thoại</nz-form-label>
        <nz-form-control nzErrorTip="Số điện thoại không hợp lệ (10-15 chữ số)!">
          <input
            nz-input
            formControlName="phone"
            placeholder="0901234567"
            size="large"
            type="tel"
            autocomplete="tel"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- Mật khẩu -->
      <nz-form-item>
        <nz-form-label nzRequired>Mật khẩu</nz-form-label>
        <nz-form-control nzErrorTip="Mật khẩu phải có ít nhất 8 ký tự!">
          <input
            nz-input
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Tối thiểu 8 ký tự"
            size="large"
            autocomplete="new-password"
            (input)="onPasswordChange()"
          />
        </nz-form-control>
        <div class="password-strength" *ngIf="registerForm.get('password')?.value">
          <nz-progress
            [nzPercent]="passwordStrength()"
            [nzShowInfo]="false"
            [nzStrokeColor]="passwordStrengthColor"
          ></nz-progress>
          <span class="strength-label" [style.color]="passwordStrengthColor">
            {{ passwordStrengthLabel }}
          </span>
        </div>
      </nz-form-item>

      <!-- Xác nhận mật khẩu -->
      <nz-form-item>
        <nz-form-label nzRequired>Xác nhận mật khẩu</nz-form-label>
        <nz-form-control
          [nzErrorTip]="
            registerForm.errors?.['passwordMismatch']
              ? 'Mật khẩu xác nhận không khớp!'
              : 'Vui lòng xác nhận mật khẩu!'
          "
        >
          <input
            nz-input
            [type]="confirmPasswordVisible() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Nhập lại mật khẩu"
            size="large"
            autocomplete="new-password"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- Điều khoản -->
      <div class="register-terms">
        <label nz-checkbox formControlName="agreeTerms">
          Tôi đồng ý với
          <a href="#" (click)="$event.preventDefault()">Điều khoản sử dụng</a>
          và
          <a href="#" (click)="$event.preventDefault()">Chính sách bảo mật</a>
        </label>
      </div>

      <!-- Submit button -->
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        nzBlock
        [nzLoading]="isSubmitting()"
        type="submit"
        [disabled]="registerForm.invalid"
        class="submit-btn"
      >
        <span *ngIf="!isSubmitting()" nz-icon nzType="check-circle"></span>
        {{ isSubmitting() ? 'Đang tạo tài khoản...' : 'Đăng ký' }}
      </button>

      <!-- Divider -->
      <div class="form-divider">
        <span>hoặc đăng ký nhanh với</span>
      </div>

      <!-- Google + KC SSO -->
      <div class="social-buttons">
        <!-- Google — đi thẳng Google, skip KC login page -->
        <button type="button" class="social-btn google-btn" (click)="registerWithGoogle()">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Đăng ký bằng Google
        </button>

        <!-- KC SSO — KC form có Google + username/password -->
        <button type="button" class="social-btn sso-btn" (click)="loginWithKeycloak()">
          <span nz-icon nzType="login" style="font-size: 18px"></span>
          Đăng nhập SSO
        </button>
      </div>
    </form>

    <!-- Footer -->
    <div class="register-footer">
      <span>Đã có tài khoản?</span>
      <a routerLink="/auth/login" class="login-link">Đăng nhập ngay</a>
    </div>
  </div>
</div>
